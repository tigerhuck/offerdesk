<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OfferDesk — Log in</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2b3a55; --txt:#eef2f8; --dim:#93a1b8;
          --gold:#e8b64c; --red:#ff6b6b; --green:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:28px 18px 40px; }
  h1 { font-size:30px; margin:0 0 6px; } h1 span { color:var(--gold); }
  .sub { color:var(--dim); font-size:15px; line-height:1.6; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px; margin-top:16px; }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  input { width:100%; padding:12px; font-size:16px; border-radius:8px;
          border:1px solid var(--line); background:#0d1320; color:var(--txt); }
  .btn { display:block; width:100%; padding:14px; font-size:17px; font-weight:700; border:none;
         border-radius:10px; background:var(--gold); color:#1a1405; margin-top:16px; cursor:pointer; }
  .btn:active { transform:scale(.98); }
  .err { background:#2b1215; border:1px solid var(--red); color:#ffb3b3;
         border-radius:10px; padding:12px; font-size:14px; line-height:1.5; margin-top:16px; }
  .flash { background:#122b1c; border:1px solid var(--green); color:#b9f0cd;
           border-radius:10px; padding:12px; font-size:14px; margin-top:16px; }
  .note { font-size:13px; color:var(--dim); line-height:1.6; text-align:center; margin-top:18px; }
  .note a { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Offer<span>Desk</span></h1>
  <p class="sub">Log in to your dealer account.</p>

  {% with msgs = get_flashed_messages() %}
    {% if msgs %}<div class="flash">{{ msgs[0] }}</div>{% endif %}
  {% endwith %}
  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <div class="card">
    <form method="post">
      <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
      <label>Email</label>
      <input name="email" type="email" required placeholder="you@yourshop.com" autocomplete="email">
      <label>Password</label>
      <input name="password" type="password" required autocomplete="current-password">
      <button class="btn" type="submit">Log in</button>
    </form>
  </div>

  <p class="note">No account yet? <a href="/pricing">Subscribe for $49/mo</a>, then
    <a href="/signup">create your account</a> with the same email you subscribed with.</p>
</div>
</body>
</html>
